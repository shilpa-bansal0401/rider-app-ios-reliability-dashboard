name: Generate Reliability Reports

on:
  schedule:
    - cron: '0 14 * * *'  # Daily 8:00 AM CST (14:00 UTC)
  workflow_dispatch:       # allow manual runs

jobs:
  generate-reports:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install google-cloud-bigquery openpyxl gspread

      - name: Rotate releases (Mondays only)
        run: |
          if [ "$(date +%u)" = "1" ]; then
            python3 update_releases.py
          fi

      - name: Generate hang report
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: python3 generate_hang_report.py

      - name: Generate crash report
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: python3 generate_crash_report.py

      - name: Authenticate to Google Cloud
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Generate sentry data and consolidation report
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: python3 fetch_sentry_data.py

      - name: Create Pages index
        run: |
          cat > index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>Rider iOS Reliability Dashboard</title>
            <style>
              body { font-family: sans-serif; max-width: 600px; margin: 80px auto; text-align: center; }
              a { display: inline-block; margin: 16px; padding: 16px 32px; background: #0066cc;
                  color: white; text-decoration: none; border-radius: 8px; font-size: 18px; }
              a:hover { background: #0052a3; }
            </style>
          </head>
          <body>
            <h1>Rider iOS Reliability Dashboard</h1>
            <p>Auto-updated daily at 8:00 AM CST</p>
            <a href="crash_report/index.html">Crash Report</a>
            <a href="hang_report/index.html">Hang Report</a>
            <a href="consolidation_report/index.html">Consolidation Report</a>
          </body>
          </html>
          EOF

      - name: Commit updated reports to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hang_report/index.html crash_report/index.html consolidation_report/index.html consolidation_report/sentry_data.xlsx index.html
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: auto-update reliability reports $(date -u '+%Y-%m-%d')" && git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
